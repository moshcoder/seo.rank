# bin/install.sh settings for seo.rank (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: settings go in $STATE_DIR/app.env, written from the logicsrc
# vault profullstack/seo-rank--prod.
#
# DOMAINS is empty on purpose: seo.rank is a Moshpit name, so there is no Let's
# Encrypt certificate to get. Its nginx vhost (/etc/nginx/sites-available/seo.rank)
# proxies to PORT with the Moshpit-issued certificate that moshpit-renew.timer keeps fresh.
APP=seo-rank
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8790
HEALTH_PATH=/health
DOMAINS=
ACCESS_LOG=off
